    <style>
      #app-splash {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #FFFFFF;
        overflow: hidden;
        z-index: 999999;
        transition: opacity 0.25s ease-out, visibility 0.25s ease-out;
      }
      #app-splash.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #app-splash .splash-inner {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #app-splash .splash-body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        max-width: 320px;
        padding: 0 16px;
        z-index: 10;
      }
      #app-splash .brand-logo-svg {
        width: 100%;
        height: auto;
        overflow: visible;
      }
      #app-splash .isotype-elastic {
        transform-origin: -13px -66px;
        animation: splashIsotypePop 0.38s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes splashIsotypePop {
        0% {
          opacity: 0;
          transform: scale(0.4) translateY(6px);
        }
        70% {
          opacity: 1;
          transform: scale(1.05) translateY(-1px);
        }
        100% {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }
      #app-splash .brand-letter-trace {
        stroke: #2D9650;
        stroke-width: 2.2;
        stroke-dasharray: 450;
        stroke-dashoffset: 450;
        fill: transparent;
        animation: splashTraceAndFillNeon 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      @keyframes splashTraceAndFillNeon {
        0% {
          stroke-dashoffset: 450;
          fill: transparent;
          filter: drop-shadow(0 0 0 rgba(45, 150, 80, 0));
        }
        50% {
          stroke-dashoffset: 0;
          fill: transparent;
          filter: drop-shadow(0 0 6px rgba(45, 150, 80, 0.5));
        }
        100% {
          stroke-dashoffset: 0;
          stroke-width: 0.6;
          fill: #2D9650;
          filter: drop-shadow(0 0 2px rgba(45, 150, 80, 0.2));
        }
      }
      #app-splash .splash-subline {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #94A3B8;
        margin-top: 14px;
        opacity: 0;
        animation: splashFadeInSubline 0.25s ease-out forwards 0.2s;
      }
      @keyframes splashFadeInSubline {
        from { opacity: 0; transform: translateY(3px); }
        to { opacity: 1; transform: translateY(0); }
      }
      #app-splash .pulse-line-track {
        width: 130px;
        height: 2.5px;
        background: #F1F5F9;
        border-radius: 999px;
        position: relative;
        overflow: hidden;
        margin-top: 14px;
        box-shadow: inset 0 1px 1px rgba(0,0,0,0.03);
      }
      #app-splash .pulse-line-glow {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(90deg, #126C36, #2D9650, #4ADE80);
        box-shadow: 0 0 8px rgba(45, 150, 80, 0.75);
        animation: splashPulseLineSlide 1.2s ease-in-out infinite;
      }
      @keyframes splashPulseLineSlide {
        0% { left: -40%; width: 30%; }
        50% { left: 35%; width: 50%; }
        100% { left: 100%; width: 30%; }
      }
    </style>

    <script>
      window.deferredPwaPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPwaPrompt = e;
        window.dispatchEvent(new Event('pwaPromptReady'));
      });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((registration) => {
            setInterval(() => registration.update(), 60 * 60 * 1000); // Check cada hora
          }).catch(() => {});
        });
      }
